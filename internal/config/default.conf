# vcomp configuration.
#
# Settings resolve in three layers, each overriding the one before it:
#
#   vcomp's built-in defaults   (this file, compiled into the binary)
#   ~/.vcomp/vcomp.conf         (your defaults for every company)
#   <company>/.vcomp/vcomp.conf (that company's own overrides)
#
# So an empty directory is already a valid company: "vcomp run -root DIR -goal
# ..." will populate it. "vcomp install" writes this file to ~/.vcomp/ for you
# to edit, and "vcomp setup" writes a short overrides file for one company.
#
# Format: "key = value" lines and "[section name]" headers. A value is the rest
# of the line, so it may contain spaces, "=" and "#". Only whole-line comments.
#
# The engine re-reads these files every tick, so edits take effect immediately.
# If one is broken, the engine keeps the last good version and logs it.
#
# The wording the agents actually live by is not here - it is in templates/ and,
# once a company exists, in each spaces/<role>/role.md. Edit those to change how
# people behave; edit this to change how the engine drives them.

# ------------------------------------------------------------------- goal ---

# What the company is for. Only the CEO is told this: it is rendered into
# spaces/ceo/goal.md when the company is created. There is deliberately no
# default - set it per company, with "vcomp setup" or the -goal flag.
goal =

# ----------------------------------------------------------------- ending ---

# The simulation ends when this file appears in the company root. Only the CEO
# writes it, and what is in it is the company's final answer to whoever set the
# goal. The engine then closes every session and prints the file.
result_file = RESULT.md

# ------------------------------------------------------------------ state ---

# The engine rewrites this file every tick with a short picture of the company:
# who is running, how deep their inbox is, how long they have been idle, when
# their space last changed, and what has happened in the product and the public
# runs. Nobody is sent it; anyone who wants it reads it. Empty disables it.
state_file = STATE.md

# ------------------------------------------------------------------ audit ---

# Every message that passes through an inbox is recorded here as JSON lines:
# sent, updated, and cleared, with the prose, who it was for, how deep that
# inbox was at the time, and how long it sat there before it went. Attachments
# are counted, not copied - they are already in the repo, and the prose is what
# is worth analysing afterwards.
#
# The engine remembers rather than intercepts, so agents keep deleting their own
# messages freely and nothing is lost once it has been seen. A message created
# and deleted inside a single tick is never observed; shortening "tick" narrows
# that window. Empty disables the trail.
audit_file = .vcomp/messages.jsonl

# ---------------------------------------------------------------- timings ---

# How often the engine looks at the company.
tick = 20s

# How many consecutive ticks with a byte-identical pane mean "stuck, nudge it".
# A working agent always animates something, so this needs no harness parsing.
idle_ticks = 3

# The same, for someone whose inbox is empty. Keep it higher: a role with
# nothing waiting for it should tick over slowly rather than fill the time with
# personal projects. Both counts can be set per role in a [role NAME] section,
# which is how one person gets throttled without slowing the company down.
idle_ticks_empty = 9

# A public user run is killed if it has not written impressions.md by then.
user_timeout = 25m

# How many times to send a user into the same run before giving up on it.
user_max_attempts = 2

# How many times a harness may exit on startup before the engine stops trying
# and prints what the command actually said. A wrong command line would
# otherwise be restarted forever, once per tick, burying the reason.
max_restarts = 3

# ---------------------------------------------------------------- harness ---

# tmux session names are "<prefix>-<role>". Give a second company on the same
# machine a different prefix so the two do not collide.
session_prefix = vcomp

# Default harness for everyone; override per role in a [role NAME] section.
harness = claude

# Who exists when the company is created. Names ending in -N share a template
# ("developer-1" and "developer-2" are both developers), and unknown names get
# the generic template. A ceo is required.
#
# This is a deliberately small default. Run "vcomp roles" for the whole
# catalogue - product managers, UX and sound designers, writers, editors, data
# analysts, fabricators, marketing and support - and put whichever of them the
# work actually needs in here.
#
# Add "hr" to let the company write its own new roles instead of only the CEO.
#
# After creation the roster lives on disk: a space with a role.md is a person.
# The CEO hires by creating spaces/<name>/role.md and fires by rewriting one.
roster = ceo, project-master, developer-1, developer-2, art-director, tester

# Command lines are split on whitespace. {{model}} and {{effort}} are
# substituted; if a value is empty its token is dropped, along with the flag it
# belonged to. So leaving "model =" empty turns "--model={{model}}" (or
# "--model {{model}}") into nothing at all, and the harness picks its own
# default. Keep each optional argument self-contained.
#
# "start" is used for someone who has never run before (or was just replaced).
# "resume" is used to bring an existing occupant back with their memory intact.

[harness claude]
start = claude --dangerously-skip-permissions --model {{model}}
resume = claude --dangerously-skip-permissions --model {{model}} --continue
model =
effort =

[harness codex]
start = codex --dangerously-bypass-approvals-and-sandbox --model={{model}} --config=model_reasoning_effort={{effort}}
resume = codex resume --last --dangerously-bypass-approvals-and-sandbox
model =
effort =
handshake = Enter

# ---------------------------------------------------------------- prompts ---

# Typed into the pane as a single line, so keep each one on one line.
# Override any of these for one person in their [role NAME] section.
#
# Keep them thin. How a role behaves - what it does when its inbox is empty,
# how it thinks, how it speaks - belongs in that role's own role.md, not here.
# These lines only hand control back to it.

[prompts]
fresh = Read ./role.md now, then ../../CONVENTIONS.md, then begin. Everything about how you work is in those two files.
back = You are back. Re-read ./role.md, check ./inbox/ and what changed in ../../product/, and pick up where you left off.
nudge = Continue. Your role.md says what that means, including when nothing is waiting for you.
user = Read ./role.md and follow it. Then stop.
user_nudge = Keep going, then write your impressions.md and stop. ./role.md has the details.

# ------------------------------------------------------------- per person ---

# Anything above can be set for one role. Sections may be added at any time,
# including for people the CEO hires later.
#
# [role ceo]
# harness = codex
# model = gpt-5.1-codex-max
# effort = high
# idle_ticks = 2
# idle_ticks_empty = 20
# nudge = Stop writing plans. Go ask someone a hard question and demand evidence.
